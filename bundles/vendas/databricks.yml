# Declarative Automation Bundle: vendas
bundle:
  name: vendas
  uuid: 0db0fe15-037a-479b-9e5e-fba2eb59691e

include:
  - resources/*.yml

variables:
  catalog:
    description: Catálogo do ambiente

targets:
  # DEV: cada pessoa na própria pasta, prefixo [dev <usuário>], agendas pausadas
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-fc825c12-d98f.cloud.databricks.com
    variables:
      catalog: dev

  # HML: só o pipeline publica (sp-lab-deploy); os jobs rodam como sp-hml-run
  hml:
    mode: production
    presets:
      name_prefix: "[hml] "          # mesmo workspace de PRD: evita nomes repetidos
      trigger_pause_status: PAUSED   # HML roda quando o pipeline mandar
    workspace:
      host: https://dbc-fc825c12-d98f.cloud.databricks.com
      root_path: /Workspace/Homologacao/.bundle/${bundle.name}
    run_as:
      service_principal_name: 37aead13-2a7b-47ca-8bf1-ce616d51770c    # sp-hml-run
    permissions:
      - service_principal_name: 93c07a43-a85e-4111-b18b-9e29a1b3290f  # sp-lab-deploy
        level: CAN_MANAGE
      - service_principal_name: 37aead13-2a7b-47ca-8bf1-ce616d51770c  # sp-hml-run
        level: CAN_VIEW
      - group_name: users
        level: CAN_VIEW
    variables:
      catalog: hml
    resources:
      schemas:
        vendas:
          grants:
            - principal: 37aead13-2a7b-47ca-8bf1-ce616d51770c   # sp-hml-run grava as tabelas do job
              privileges: [USE_SCHEMA, SELECT, MODIFY, CREATE_TABLE]

  # PRD: só o pipeline publica, depois da aprovação, e só a partir da main
  prod:
    mode: production
    git:
      branch: main
    presets:
      name_prefix: "[prd] "
      trigger_pause_status: PAUSED   # só no laboratório, para poupar a cota da Free Edition
    workspace:
      host: https://dbc-fc825c12-d98f.cloud.databricks.com
      root_path: /Workspace/Production/.bundle/${bundle.name}
    run_as:
      service_principal_name: d399823d-8297-423b-a91c-b9da3a33fbff    # sp-prd-run
    permissions:
      - service_principal_name: a18ce796-4f4e-46ed-9369-30fa0443b718  # sp-prd-deploy
        level: CAN_MANAGE
      - service_principal_name: d399823d-8297-423b-a91c-b9da3a33fbff  # sp-prd-run
        level: CAN_VIEW
      - group_name: users
        level: CAN_VIEW
    variables:
      catalog: prod
    resources:
      schemas:
        vendas:
          grants:
            - principal: d399823d-8297-423b-a91c-b9da3a33fbff   # sp-prd-run grava as tabelas do job
              privileges: [USE_SCHEMA, SELECT, MODIFY, CREATE_TABLE]
