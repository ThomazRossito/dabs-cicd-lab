# This is a Declarative Automation Bundle definition for vendas.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: vendas
  uuid: 0db0fe15-037a-479b-9e5e-fba2eb59691e

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-fc825c12-d98f.cloud.databricks.com
    variables:
      catalog: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-fc825c12-d98f.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/thomaz.rossito@hotmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/thomaz.rossito@hotmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dev
    permissions:
      - user_name: thomaz.rossito@hotmail.com
        level: CAN_MANAGE
