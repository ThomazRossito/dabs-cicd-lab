name: vendas

on:
  pull_request:
    branches: [main]   # sem paths: o pr-check é obrigatório no ruleset, então roda em todo PR
    types: [opened, synchronize, reopened, labeled, unlabeled]   # roda de novo ao pôr/tirar label
  push:
    branches: [main]
    paths: ["bundles/vendas/**", ".github/workflows/vendas.yml"]

permissions:
  contents: read

jobs:
  # 1. Em todo PR: valida e mostra o plano de HML. Só recebe a credencial de HML.
  pr-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    environment: hml
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_AUTH_TYPE: oauth-m2m
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    defaults:
      run:
        working-directory: bundles/vendas
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: databricks/setup-cli@2bf4520fd10723ed5a22eca62a8c8a63714a7ba9  # v1.21.0
        with:
          version: 1.21.0
      - run: databricks bundle validate -t hml
      - run: databricks bundle plan -t hml
      - name: Bloquear delete/recreate sem o label permite-delete
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'permite-delete') }}
        run: |
          set -o pipefail   # se o plan falhar, o step falha (não passa em silêncio)
          destrutivos=$(databricks bundle plan -t hml -o json \
            | jq -r '.plan | to_entries[]
                     | select(.value.action == "delete" or .value.action == "recreate")
                     | select(.value.state_only != true) | .key')
          if [ -n "$destrutivos" ]; then
            echo "::error::O plano apaga ou recria: $destrutivos"
            echo "::error::Se for intencional, adicione o label 'permite-delete' ao PR."
            exit 1
          fi

  # 2. Depois do merge: publica em HML e roda o job como sp-hml-run.
  deploy-hml:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment: hml
    concurrency: vendas-hml
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_AUTH_TYPE: oauth-m2m
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    defaults:
      run:
        working-directory: bundles/vendas
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: databricks/setup-cli@2bf4520fd10723ed5a22eca62a8c8a63714a7ba9  # v1.21.0
        with:
          version: 1.21.0
      - run: databricks bundle deploy -t hml --auto-approve
      - run: databricks bundle run -t hml sample_job

  # 3. Só depois de HML passar, e só com a sua aprovação: publica em PRD.
  deploy-prod:
    needs: deploy-hml
    runs-on: ubuntu-24.04
    environment: prod
    concurrency: vendas-prod
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_AUTH_TYPE: oauth-m2m
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    defaults:
      run:
        working-directory: bundles/vendas
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: databricks/setup-cli@2bf4520fd10723ed5a22eca62a8c8a63714a7ba9  # v1.21.0
        with:
          version: 1.21.0
      - run: databricks bundle plan -t prod
      - run: databricks bundle deploy -t prod --fail-on-active-runs   # sem --auto-approve, de propósito
